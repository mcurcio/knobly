# rasl config split in two files: sink.conf is included at two places, each with its own variables.
# `$leds_host` has a default here; a program may hand in its own value, which wins (L3).

@set $pixels 2284;
@set $leds_host "10.0.60.30";

graph {
    node Waveform hue_ramp {
        shape sine;
        frequency_hz 0.01;
        output_channels 150;
        fps 30;
    }

    node Color crossfade_rgb rgb {
        connect hue_ramp;
    }

    @include "sink.conf" {
        @set $name leds;
        @set $host $leds_host;
    }

    @include "sink.conf" {
        @set $name porch;
        @set $host "10.0.60.31";
    }
}

# Checks on every push and pull request; on a push to main that passes them, the release job runs
# semantic-release (.releaserc.json). Releases are dry-run until the owner sets the repository variable
# RELEASE_ENABLED to 'true' (owner, 2026-10-23: "Dry-run until I enable it"). In dry-run the job computes the
# next version, builds the release assets (the npm package, the Python wheel and sdist, the C++ source archive and
# single header: .github/release-build.sh) and uploads them as a workflow artifact; it never tags or releases.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Exact tool versions, one place each. Actions are pinned by full commit sha (tag in the comment).
env:
  NODE_VERSION: 24.22.1
  JAVA_VERSION: 21.0.13+9
  UV_VERSION: 0.13.5
  BISON_APT_VERSION: 2:3.8.2+dfsg-1build2
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  grammar:
    name: Grammar soundness (tools/check.sh)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bison
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends --allow-downgrades "bison=$BISON_APT_VERSION"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: bash tools/check.sh

  ts:
    name: TypeScript (Node 24)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - run: corepack pnpm install --frozen-lockfile
      # Each script regenerates the parser first (tools/gen.sh ts).
      - run: corepack pnpm test
      - run: corepack pnpm typecheck
      - run: corepack pnpm lint
      - run: corepack pnpm build
      # The shared conformance driver (spec/conformance.md) against this binding's adapter, on the build above.
      - run: python3 ../conformance/driver/run.py -- node conformance/adapter.ts

  py:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: [3.11.17, 3.13.17]
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      # conftest.py regenerates the parser first (tools/gen.sh py); test_build.py runs uv build.
      - run: uv run --locked pytest
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      - run: uv run --locked mypy
      # The shared conformance driver (spec/conformance.md) against this binding's adapter; pytest generated the parser.
      - run: python3 ../conformance/driver/run.py -- uv run --locked python conformance/adapter.py

  cpp-format:
    name: C++ format (clang-format)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      # The hand-written C++ against the pinned clang-format; the pin's one home is tools/api/emit_cpp.py.
      - run: |
          read -r -a format < <(python3 -c 'import sys; sys.path.insert(0, "tools"); from api.emit_cpp import CLANG_FORMAT; print(*CLANG_FORMAT)')
          git ls-files 'cpp/*.hpp' 'cpp/*.cpp' | xargs "${format[@]}" --dry-run --Werror --style=file:cpp/.clang-format

  cpp:
    name: C++ (${{ matrix.compiler }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    # A stalled build or adapter fails the job instead of holding the runner for hours (vil-p5x; the driver also
    # times out each request, and ctest each test).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every compiler in both modes (design.md 2.5): header-only, and compiled (VILLANELLE_COMPILED, the one
        # implementation file), one leg each so each stays fast. The sanitizers run on one leg. Compilers come with
        # the runner image, pinned to a major version here (apt's exact versions move with the image's runtime
        # libraries); each leg prints the full version it ran. No MSVC leg (vil-a0y): a Windows checkout fails on
        # conformance/expected/nul.json (NUL is a reserved device name there).
        include:
          - compiler: gcc
            mode: header-only
            os: ubuntu-24.04
            cxx: g++-13
            flags: -DVILLANELLE_SANITIZE=ON
          - compiler: gcc
            mode: compiled
            os: ubuntu-24.04
            cxx: g++-13
            flags: -DVILLANELLE_COMPILED=ON
          - compiler: clang
            mode: header-only
            os: ubuntu-24.04
            cxx: clang++-18
            flags: ""
          - compiler: clang
            mode: compiled
            os: ubuntu-24.04
            cxx: clang++-18
            flags: -DVILLANELLE_COMPILED=ON -DCMAKE_CXX_STANDARD=23
          - compiler: appleclang
            mode: header-only
            os: macos-15
            cxx: c++
            developer_dir: /Applications/Xcode_16.4.app/Contents/Developer
            flags: -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
          - compiler: appleclang
            mode: compiled
            os: macos-15
            cxx: c++
            developer_dir: /Applications/Xcode_16.4.app/Contents/Developer
            flags: -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 -DVILLANELLE_COMPILED=ON
    env:
      CXX: ${{ matrix.cxx }}
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # clang-format, the generated headers' formatter, comes through uv (spec/codegen.md section 4).
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: $CXX --version
      # Configure generates the headers (tools/gen.sh cpp); ctest runs the unit tests, the generated contract, the
      # design's programs, the compile-fail tests and the shared driver.
      - run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Debug -DVILLANELLE_BUILD_TESTS=ON ${{ matrix.flags }}
      # Wall time of -fsyntax-only -O2 on a file including only one public header, in header-only and compiled mode
      # (design.md 2.5 point 4): reported, not gated. Configure generated the headers.
      - name: Compile-time report (reported, not gated)
        if: matrix.compiler == 'gcc' && matrix.mode == 'header-only'
        run: |
          TIMEFORMAT=%R
          printf '%-16s %12s %9s\n' header header-only compiled
          for header in cpp/include/villanelle/*.hpp; do
            name=${header##*/}
            [ "$name" = implementation.hpp ] && continue
            row=$(printf '%-16s' "$name")
            for mode in 1 0; do
              if seconds=$( { time "$CXX" -std=c++20 -fsyntax-only -O2 -DVILLANELLE_HEADER_ONLY=$mode -Icpp/include \
                  -x c++ - <<< "#include <villanelle/$name>" > /dev/null 2>&1; } 2>&1 ); then
                row+=$(printf ' %11ss' "$seconds")
              else
                row+=$(printf ' %12s' failed)
              fi
            done
            echo "$row"
          done
      - run: cmake --build build --config Debug
      - run: ctest --test-dir build --build-config Debug --output-on-failure

  cpp-package:
    name: C++ package (FetchContent, add_subdirectory, single header)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CXX: g++-13
      # A made-up version, so the test proves it is stamped into the archive and the inline namespace
      # (villanelle::v1_2_3).
      VERSION: 1.2.3
    steps:
      - run: echo "WORK=$RUNNER_TEMP/package" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      # The release flow's own script (.github/release-build.sh runs it): the source archive and the single header.
      - run: bash .github/release-cpp.sh "$VERSION" "$WORK/assets"
      # A tiny program by every route, with nothing installed and python, python3, uv and curl stubbed to fail:
      # FetchContent of the archive (header-only and compiled), add_subdirectory of it, the single header alone. Each
      # exits 0 only on the expected output, and its symbols carry the stamped inline namespace.
      - run: bash cpp/tests/consumer/check.sh "$VERSION" "$WORK/assets" "$WORK"

  # The release flow's own build (.github/release-build.sh, semantic-release's prepare step) end to end on every push
  # and pull request, so a change that breaks it fails here instead of in the release job on main. The version is
  # made up (any semver that is also a valid Python version) so the asset names prove it was stamped.
  release-build:
    name: Release build (.github/release-build.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: 1.2.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: corepack pnpm -C ts install --frozen-lockfile
      - run: bash .github/release-build.sh "$VERSION"
      # The five assets .releaserc.json attaches, and no stamped version left in the tree.
      - run: |
          for asset in "villanelle-$VERSION.tgz" "villanelle-$VERSION-py3-none-any.whl" "villanelle-$VERSION.tar.gz" \
              "villanelle-cpp-$VERSION.tar.gz" villanelle.hpp; do
            [ -s "dist/release/$asset" ] || { echo "::error::missing release asset dist/release/$asset"; exit 1; }
          done
          changed=$(git status --porcelain)
          [ -z "$changed" ] || { echo "::error::release-build.sh left changes in the tree:"; echo "$changed"; exit 1; }

  # The user guide (docs/site/, MkDocs Material: .claude/design/cpp/frozen-docs.md). Built on every push and pull
  # request; a missing sample file or region fails the build (pymdownx.snippets check_paths, --strict). The samples
  # themselves run in the ts, py and cpp jobs (each binding's tests run examples/samples.json).
  docs:
    name: User guide (MkDocs)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_PYTHON: 3.13.17
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv run --locked mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/build

  # Publishes the guide built above to GitHub Pages, only from main (the repository's Pages source must be "GitHub
  # Actions").
  docs-deploy:
    name: User guide (deploy to GitHub Pages)
    needs: [docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    name: Release (semantic-release)
    needs: [grammar, ts, py, cpp-format, cpp, cpp-package, release-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: release
      cancel-in-progress: false
    # contents: write is needed in dry-run too: semantic-release always checks push access (git push --dry-run).
    # Comments, labels and failure issues are off in .releaserc.json, so no issues or pull-requests scope.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm -C ts install --frozen-lockfile
      - name: semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
        run: |
          if [ "$RELEASE_ENABLED" = true ]; then
            corepack pnpm exec semantic-release
          else
            echo "::notice::RELEASE_ENABLED is not 'true': dry-run, no tag or release"
            corepack pnpm exec semantic-release --dry-run
          fi
      # Dry-run only: semantic-release skips its prepare step (the build), so build here with the computed version.
      - name: Build the packages (dry-run)
        if: vars.RELEASE_ENABLED != 'true' && steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: bash .github/release-build.sh "$VERSION"
      - name: Upload the packages (dry-run)
        if: vars.RELEASE_ENABLED != 'true' && steps.release.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: villanelle-${{ steps.release.outputs.version }}
          path: dist/release/
          if-no-files-found: error

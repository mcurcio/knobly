# Checks on every push and pull request; on a push to main that passes them, the release job runs
# semantic-release (.releaserc.json). Releases are dry-run until the owner sets the repository variable
# RELEASE_ENABLED to 'true' (owner, 2026-10-23: "Dry-run until I enable it"). In dry-run the job computes the
# next version, builds both packages and uploads them as a workflow artifact; it never tags or releases.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Exact tool versions, one place each. Actions are pinned by full commit sha (tag in the comment).
env:
  NODE_VERSION: 24.22.1
  JAVA_VERSION: 21.0.13+9
  UV_VERSION: 0.13.5
  BISON_APT_VERSION: 2:3.8.2+dfsg-1build2
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  grammar:
    name: Grammar soundness (tools/check.sh)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bison
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends --allow-downgrades "bison=$BISON_APT_VERSION"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: bash tools/check.sh

  ts:
    name: TypeScript (Node 24)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - run: corepack pnpm install --frozen-lockfile
      # Each script regenerates the parser first (tools/gen.sh ts).
      - run: corepack pnpm test
      - run: corepack pnpm typecheck
      - run: corepack pnpm lint
      - run: corepack pnpm build
      # The shared conformance driver (spec/conformance.md) against this binding's adapter, on the build above.
      - run: python3 ../conformance/driver/run.py -- node conformance/adapter.ts

  py:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: [3.11.17, 3.13.17]
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      # conftest.py regenerates the parser first (tools/gen.sh py); test_build.py runs uv build.
      - run: uv run --locked pytest
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      - run: uv run --locked mypy
      # The shared conformance driver (spec/conformance.md) against this binding's adapter; pytest generated the parser.
      - run: python3 ../conformance/driver/run.py -- uv run --locked python conformance/adapter.py

  cpp:
    name: C++ (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Compilers come with the runner image, pinned to a major version here (apt's exact versions move with the
          # image's runtime libraries); each leg prints the full version it ran.
          - leg: gcc
            os: ubuntu-24.04
            cxx: g++-13
            flags: -DVILLANELLE_SANITIZE=ON
          - leg: clang
            os: ubuntu-24.04
            cxx: clang++-18
            flags: -DVILLANELLE_COMPILED=ON -DCMAKE_CXX_STANDARD=23
          - leg: appleclang
            os: macos-15
            cxx: c++
            developer_dir: /Applications/Xcode_16.4.app/Contents/Developer
            flags: -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
          - leg: msvc  # the Visual Studio generator picks MSVC itself
            os: windows-2022
            cxx: ""
            flags: ""
    env:
      CXX: ${{ matrix.cxx }}
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # clang-format, the generated headers' formatter, comes through uv (spec/codegen.md section 4).
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Compiler version
        run: if [ -n "$CXX" ]; then "$CXX" --version; fi
      # The hand-written C++ against the pinned clang-format; the pin's one home is tools/api/emit_cpp.py.
      - name: clang-format (hand-written files)
        if: matrix.leg == 'gcc'
        run: |
          read -r -a format < <(python3 -c 'import sys; sys.path.insert(0, "tools"); from api.emit_cpp import CLANG_FORMAT; print(*CLANG_FORMAT)')
          git ls-files 'cpp/*.hpp' 'cpp/*.cpp' | xargs "${format[@]}" --dry-run --Werror --style=file:cpp/.clang-format
      # Configure generates the headers (tools/gen.sh cpp); ctest runs the unit tests, the generated contract and the
      # shared driver's level 0.
      - run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Debug -DVILLANELLE_BUILD_TESTS=ON ${{ matrix.flags }}
      - run: cmake --build build --config Debug
      - run: ctest --test-dir build --build-config Debug --output-on-failure

  release:
    name: Release (semantic-release)
    needs: [grammar, ts, py, cpp]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: release
      cancel-in-progress: false
    # contents: write is needed in dry-run too: semantic-release always checks push access (git push --dry-run).
    # Comments, labels and failure issues are off in .releaserc.json, so no issues or pull-requests scope.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm -C ts install --frozen-lockfile
      - name: semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
        run: |
          if [ "$RELEASE_ENABLED" = true ]; then
            corepack pnpm exec semantic-release
          else
            echo "::notice::RELEASE_ENABLED is not 'true': dry-run, no tag or release"
            corepack pnpm exec semantic-release --dry-run
          fi
      # Dry-run only: semantic-release skips its prepare step (the build), so build here with the computed version.
      - name: Build the packages (dry-run)
        if: vars.RELEASE_ENABLED != 'true' && steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: bash .github/release-build.sh "$VERSION"
      - name: Upload the packages (dry-run)
        if: vars.RELEASE_ENABLED != 'true' && steps.release.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: villanelle-${{ steps.release.outputs.version }}
          path: dist/release/
          if-no-files-found: error

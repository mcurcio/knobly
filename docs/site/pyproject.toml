# The user guide's static site generator: a build-time tool only, never a dependency of any knobly package.
# Build: cd docs/site && uv run --locked mkdocs build --strict (CI's docs job). Serve while writing: uv run --locked mkdocs serve.
[project]
name = "knobly-docs"
version = "0"
requires-python = ">=3.11"
dependencies = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "pymdown-extensions==12.2",
    "knobly-pygments",
]

[tool.uv]
package = false

[tool.uv.sources]
# The ```knobly lexer, run by grammar/Knobly.g4 (lexer/src/knobly_pygments).
knobly-pygments = { path = "lexer", editable = true }

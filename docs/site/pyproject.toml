# The user guide's static site generator: a build-time tool only, never a dependency of any villanelle package.
# Build: cd docs/site && uv run --locked mkdocs build --strict (CI's docs job). Serve while writing: uv run --locked mkdocs serve.
[project]
name = "villanelle-docs"
version = "0"
requires-python = ">=3.11"
dependencies = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "pymdown-extensions==12.2",
]

[tool.uv]
package = false
